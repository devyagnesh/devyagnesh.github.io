<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="bingbot" content="noindex, nofollow">
    <title>Kiba | Admin Login</title>
    <link href="./assets/css/style.css" type="text/css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="./assets/js/app.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md bg-white p-8 rounded-md shadow-sm border border-gray-200">
        <h2 class="text-2xl font-bold text-red-600 text-center mb-6">⚠️ Admin Access Only</h2>
        <form>
            <div class="mb-5">
                <label class="block text-custom-blue font-semibold mb-2" for="email">Email</label>
                <input class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-5">
                <label class="block text-custom-blue font-semibold mb-2" for="password">Password</label>
                <input class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="flex items-center justify-between mb-5 text-sm">
                <label class="flex items-center text-gray-700">
                    <input type="checkbox" class="mr-2 rounded text-blue-600 focus:ring-blue-500">
                    Remember Me
                </label>
                <a href="#" class="text-blue-500 hover:underline">Forgot Password?</a>
            </div>
            <button class="w-full bg-custom-blue text-white py-3 rounded-lg font-semibold hover:bg-blue-900 transition duration-300 shadow-md">Login</button>
        </form>
    </div>
</body>
</html>
